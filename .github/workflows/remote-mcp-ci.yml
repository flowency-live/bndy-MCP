name: Remote MCP CI/CD

on:
  pull_request:
    paths:
      - 'remote/**'
      - '.github/workflows/remote-mcp-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'remote/**'
      - '.github/workflows/remote-mcp-ci.yml'

permissions:
  contents: write

env:
  AWS_REGION: eu-west-2
  AWS_DEFAULT_REGION: eu-west-2
  NODE_VERSION: '22'
  SAM_CLI_TELEMETRY: '0'

jobs:
  check:
    name: Validate remote MCP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run check

      - name: MCP integration tests
        run: npm test

      - name: Bundle Lambda
        run: npm run build

      - name: Validate SAM template
        run: sam validate -t template.yaml --region "$AWS_REGION"

      - name: SAM build
        run: sam build -t template.yaml

  deploy:
    name: Deploy remote MCP to AWS
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: remote

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        id: aws_auth
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm install

      - name: Bundle Lambda
        run: npm run build

      - name: SAM build
        run: sam build -t template.yaml

      - name: SAM deploy
        id: sam_deploy
        if: steps.aws_auth.outcome == 'success'
        continue-on-error: true
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name bndy-remote-mcp \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --s3-bucket bndy-deployment-artifacts-1758805276 \
            --s3-prefix bndy-remote-mcp

      - name: Smoke test deployment
        id: smoke
        if: steps.sam_deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL=$(aws cloudformation describe-stacks \
            --stack-name bndy-remote-mcp \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='RemoteMcpFunctionUrl'].OutputValue | [0]" \
            --output text)

          test -n "$BASE_URL" && test "$BASE_URL" != "None"
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "Remote MCP base URL: $BASE_URL"

          curl -fsS "${BASE_URL}health" | tee /tmp/health.json
          jq -e '.service == "bndy-remote-mcp" and .status == "ok"' /tmp/health.json >/dev/null

          STATUS=$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"bndy-ci","version":"1.0.0"}}}' \
            "${BASE_URL}mcp")
          test "$STATUS" = "401"

      - name: Record sanitised deployment status
        if: always()
        shell: bash
        env:
          AWS_AUTH_OUTCOME: ${{ steps.aws_auth.outcome }}
          DEPLOY_OUTCOME: ${{ steps.sam_deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          ENDPOINT="${BASE_URL:-}"
          if [ -n "$ENDPOINT" ]; then
            MCP_ENDPOINT="${ENDPOINT}mcp"
            HEALTH_ENDPOINT="${ENDPOINT}health"
          else
            MCP_ENDPOINT=""
            HEALTH_ENDPOINT=""
          fi

          mkdir -p /tmp/bndy-mcp-status/diagnostics
          jq -n \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg awsCredentials "$AWS_AUTH_OUTCOME" \
            --arg deployment "$DEPLOY_OUTCOME" \
            --arg smokeTest "$SMOKE_OUTCOME" \
            --arg mcpEndpoint "$MCP_ENDPOINT" \
            --arg healthEndpoint "$HEALTH_ENDPOINT" \
            '{service:"bndy-remote-mcp",recordedAt:$recordedAt,sourceSha:$sourceSha,awsCredentials:$awsCredentials,deployment:$deployment,smokeTest:$smokeTest,mcpEndpoint:$mcpEndpoint,healthEndpoint:$healthEndpoint,clientTokenSecret:"bndy/remote-mcp"}' \
            > /tmp/bndy-mcp-status/diagnostics/remote-mcp-deploy.json

          git config user.name 'bndy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --orphan remote-mcp-status-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p diagnostics
          cp /tmp/bndy-mcp-status/diagnostics/remote-mcp-deploy.json diagnostics/remote-mcp-deploy.json
          git add diagnostics/remote-mcp-deploy.json
          git commit -m 'Record remote MCP deployment status'
          git push --force origin HEAD:remote-mcp-deploy-status

          cat diagnostics/remote-mcp-deploy.json >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce deployment success
        if: always()
        shell: bash
        env:
          AWS_AUTH_OUTCOME: ${{ steps.aws_auth.outcome }}
          DEPLOY_OUTCOME: ${{ steps.sam_deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          test "$AWS_AUTH_OUTCOME" = "success"
          test "$DEPLOY_OUTCOME" = "success"
          test "$SMOKE_OUTCOME" = "success"
