name: Remote MCP CI

on:
  pull_request:
    paths:
      - 'remote/**'
      - '.github/workflows/remote-mcp-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'remote/**'
      - '.github/workflows/remote-mcp-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run check

      - name: Wrangler dry build
        run: npm run build:dry
