AWSTemplateFormatVersion: '2010-09-09'
Description: One-time AWS bootstrap for BNDY remote MCP GitHub OIDC deployment

Parameters:
  GitHubOrg:
    Type: String
    Default: flowency-live
  GitHubRepo:
    Type: String
    Default: bndy-MCP
  DeploymentBucket:
    Type: String
    Default: bndy-deployment-artifacts-1758805276

Resources:
  RemoteMcpClientToken:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: bndy/remote-mcp
      Description: Bearer credential used by ChatGPT and other remote MCP clients
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: token
        PasswordLength: 64
        ExcludePunctuation: true

  RemoteMcpExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bndy-remote-mcp-execution-role
      Description: Minimal Lambda execution role for the BNDY remote MCP facade
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  RemoteMcpGitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bndy-remote-mcp-github-deploy
      Description: Short-lived GitHub Actions OIDC deployment role for BNDY remote MCP
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: bndy-remote-mcp-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationControlPlane
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource: '*'
              - Sid: DeploymentBucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${DeploymentBucket}
                Condition:
                  StringLike:
                    s3:prefix:
                      - bndy-remote-mcp/*
                      - bndy-remote-mcp
              - Sid: DeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${DeploymentBucket}/bndy-remote-mcp/*
              - Sid: RemoteMcpLambda
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:CreateFunctionUrlConfig
                  - lambda:GetFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:bndy-remote-mcp
              - Sid: ReadRemoteMcpExecutionRole
                Effect: Allow
                Action: iam:GetRole
                Resource: !GetAtt RemoteMcpExecutionRole.Arn
              - Sid: PassRemoteMcpExecutionRoleOnlyToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RemoteMcpExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ResolveMcpSecrets
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bndy/mcp-service-*
                  - !Ref RemoteMcpClientToken

Outputs:
  GitHubDeployRoleArn:
    Description: Role ARN used by the bndy-MCP GitHub Actions workflow
    Value: !GetAtt RemoteMcpGitHubDeployRole.Arn
  LambdaExecutionRoleArn:
    Description: Minimal execution role used by the remote MCP Lambda
    Value: !GetAtt RemoteMcpExecutionRole.Arn
  RemoteMcpClientTokenSecretArn:
    Description: Secret containing the ChatGPT-facing bearer token
    Value: !Ref RemoteMcpClientToken
